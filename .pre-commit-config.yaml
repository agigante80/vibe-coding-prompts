# Optional convenience layer; CI is the enforcement layer (see #20, #24).
# Install once per clone:  pip install pre-commit && pre-commit install
# (default_install_hook_types below makes that one command install both the
#  commit-stage and push-stage hooks.)
#
# Known limit: a commit that ONLY deletes a prompt does not trigger the
# index hook (pre-commit skips deleted paths); CI's --check catches it.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: prompt-index
        name: regenerate README prompt index
        entry: python3 scripts/update_prompt_index.py
        language: system
        # keep in sync with is_prompt_path() in scripts/update_prompt_index.py
        files: ^(prompts/[^/]+\.md|README\.md|scripts/update_prompt_index\.py)$
        pass_filenames: false
      - id: prompt-version-bump
        name: check prompt version bumps
        # Push stage: gates the refs actually being pushed (pre-commit exposes
        # PRE_COMMIT_FROM_REF = remote revision, PRE_COMMIT_TO_REF = local
        # revision). The script handles every unusable-base case itself (new
        # remote branch zero SHA, missing origin/main, unrelated histories)
        # by skipping with exit 0. Upstream limit: pre-commit derives the
        # env pair from the FIRST pushed ref only, so a multi-ref push gates
        # one ref locally; CI gates each PR and push authoritatively.
        entry: bash -c 'exec python3 scripts/check_version_bump.py "${PRE_COMMIT_FROM_REF:-origin/main}" "${PRE_COMMIT_TO_REF:-HEAD}"'
        language: system
        stages: [pre-push]
        # keep in sync with is_prompt_path() in scripts/update_prompt_index.py
        files: ^prompts/[^/]+\.md$
        pass_filenames: false
      - id: prompt-index-tests
        name: prompt index generator tests
        entry: python3 -m unittest discover -s scripts -p "test_*.py"
        language: system
        files: ^scripts/.*\.py$
        pass_filenames: false

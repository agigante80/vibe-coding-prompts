name: Prompt index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run generator tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Verify README prompt index is fresh
        run: python3 scripts/update_prompt_index.py --check

      - name: Verify changed prompts were version bumped (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py "origin/$BASE_REF"

      - name: Verify changed prompts were version bumped (push)
        # Direct pushes to main are gated against the previous tip. The
        # all-zero SHA (branch creation, force push) has no valid base.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/check_version_bump.py "${{ github.event.before }}"

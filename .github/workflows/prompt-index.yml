name: Prompt index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prompt-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run generator tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Verify README prompt index is fresh
        run: python3 scripts/update_prompt_index.py --check

      - name: Verify changed prompts were version bumped (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py "origin/$BASE_REF"

      - name: Verify changed prompts were version bumped (push)
        # Direct pushes to main are gated against the previous tip.
        # Branch creation delivers the all-zero SHA; a force push delivers a
        # real but now-unreachable SHA. Both have no usable base, so skip.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "skipped: base $BEFORE is unreachable (force push)"
            exit 0
          fi
          python3 scripts/check_version_bump.py "$BEFORE"

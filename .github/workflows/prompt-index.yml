name: Prompt index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run generator tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Verify README prompt index is fresh
        run: python3 scripts/update_prompt_index.py --check

      - name: Verify changed prompts were version bumped
        if: github.event_name == 'pull_request'
        run: scripts/check-version-bump.sh "${{ github.event.pull_request.base.sha }}"

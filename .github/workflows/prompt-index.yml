name: Prompt index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prompt-index-${{ github.ref }}
  # Cancel superseded runs only for PRs: every push-to-main audit must
  # complete, or a rapid second push could bury the first one's violations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run generator tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Verify README prompt index is fresh
        run: python3 scripts/update_prompt_index.py --check

      - name: Verify changed prompts were version bumped (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py --require-base "origin/$BASE_REF"

      - name: Verify changed prompts were version bumped (push)
        # Direct pushes to main are gated against the previous tip. The
        # script itself skips (exit 0, with a ::warning:: annotation) when
        # the base is unusable: branch creation's all-zero SHA, a force
        # push's unreachable SHA, or unrelated histories.
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/check_version_bump.py "$BEFORE"
